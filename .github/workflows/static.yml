        principalmente al trabajo doméstico. ¿Era este un patrón común en Antioquia o una particularidad de mi familia?
        Jaramillo-Echeverri, Meisel-Roca y Ramírez-Giraldo (2019) documentan que la inversión en educación se aceleró
        después de mediados de siglo; los censos permiten ver si esa expansión llegó por igual a hombres y mujeres.
