<script>
/* =====================================================================
   DATOS — EDITE SOLO ESTA PARTE
   Reemplace los números por los que digitalice de los censos del DANE.
   Cuando todos sean reales, cambie  ejemplo: true  por  ejemplo: false
   y desaparecerán los sellos rojos de "Datos ilustrativos".
   ===================================================================== */
const DATOS = {
  ejemplo: true,

  // Años de los censos que va a usar (puede agregar 1938)
  censos: [1938, 1951, 1964, 1973],

  // Población total por municipio (mismo orden que "censos")
  poblacion: {
    "Medellín": [150000, 350000, 750000, 1050000],
    "Amagá":    [ 15000,  18000,  20000,   22000],
    "Titiribí": [ 15000,  14000,  13000,   12000]
  },

  // % de población en la cabecera municipal
  porcentajeCabecera: {
    "Medellín": [80, 90, 95, 97],
    "Amagá":    [25, 30, 35, 40],
    "Titiribí": [20, 22, 25, 28]
  },

  // Tasa de alfabetismo (%) en Antioquia por sexo y zona
  alfabetismo: {
    total:    { hombres: [55, 65, 75, 82], mujeres: [50, 62, 74, 83] },
    cabecera: { hombres: [70, 80, 87, 91], mujeres: [65, 78, 86, 91] },
    resto:    { hombres: [45, 55, 62, 68], mujeres: [40, 50, 60, 67] }
  },

  // Periodo aproximado de traslado de la familia a Medellín (franja sombreada)
  periodoTraslado: [1951, 1964],

  // Lugares del mapa
  lugares: [
    { nombre: "Titiribí", coords: [6.0636, -75.7928], color: "#4f6b47",
      texto: "Tierras, agricultura y ganadería. Municipio con tradición minera (mina El Zancudo, siglo XIX).",
      familia: "[COMPLETAR: qué hacía aquí la familia]" },
    { nombre: "Amagá", coords: [6.0397, -75.7031], color: "#33302d",
      texto: "Cuenca carbonífera del suroeste, conectada con Medellín por ferrocarril.",
      familia: "[COMPLETAR: vínculo de la familia con el carbón]" },
    { nombre: "Medellín", coords: [6.2518, -75.5636], color: "#a4512b",
      texto: "Centro industrial y textil; destino de migración desde el campo antioqueño.",
      familia: "[COMPLETAR: llegada, barrio, empleo, universidad]" }
  ]
};
/* =================== FIN DE LA PARTE EDITABLE ======================= */

const COLORES = { "Medellín": "#a4512b", "Amagá": "#33302d", "Titiribí": "#4f6b47" };

// Sellos de datos ilustrativos
if (DATOS.ejemplo) {
  document.querySelectorAll(".grafica").forEach(g => g.classList.add("datos-ejemplo"));
}

// ---------- Mapa ----------
(function () {
  if (typeof L === "undefined") return;
  const mapa = L.map("mapa", { scrollWheelZoom: false }).setView([6.14, -75.68], 11);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 18
  }).addTo(mapa);

  const puntos = [];
  DATOS.lugares.forEach(l => {
    puntos.push(l.coords);
    L.circleMarker(l.coords, {
      radius: 11, color: "#fffdf9", weight: 3, fillColor: l.color, fillOpacity: 1
    }).addTo(mapa)
      .bindPopup(`<h4>${l.nombre}</h4><p>${l.texto}</p><p><strong>Mi familia:</strong> ${l.familia}</p>`)
      .bindTooltip(l.nombre, { permanent: true, direction: "right", offset: [12, 0] });
  });
  L.polyline(puntos, { color: "#a4512b", weight: 3, dashArray: "8 8", opacity: .85 }).addTo(mapa);
  mapa.fitBounds(puntos, { padding: [60, 60] });
})();

// ---------- Gráficas ----------
if (typeof Chart !== "undefined") {
  Chart.defaults.font.family = "'Source Sans 3', sans-serif";
  Chart.defaults.font.size = 14;
  Chart.defaults.color = "#5e5249";

  const fmt = n => n.toLocaleString("es-CO");

  // Plugin: franja del periodo de traslado familiar
  const franjaTraslado = {
    id: "franjaTraslado",
    beforeDatasetsDraw(chart) {
      const [ini, fin] = DATOS.periodoTraslado || [];
      if (ini == null) return;
      const x = chart.scales.x, a = chart.chartArea, c = chart.ctx;
      const i0 = DATOS.censos.indexOf(ini), i1 = DATOS.censos.indexOf(fin);
      if (i0 < 0 || i1 < 0) return;
      const x0 = x.getPixelForValue(i0), x1 = x.getPixelForValue(i1);
      c.save();
      c.fillStyle = "rgba(184,137,46,.13)";
      c.fillRect(x0, a.top, x1 - x0, a.bottom - a.top);
      c.fillStyle = "#8a6620";
      c.font = "600 12px 'Source Sans 3'";
      c.fillText("Traslado de la familia", x0 + 6, a.top + 16);
      c.restore();
    }
  };

  // 1. Población
  const indice = serie => serie.map(v => +(v / serie[0] * 100).toFixed(1));
  const datasetsPob = modo => Object.entries(DATOS.poblacion).map(([nom, serie]) => ({
    label: nom,
    data: modo === "indice" ? indice(serie) : serie,
    borderColor: COLORES[nom], backgroundColor: COLORES[nom],
    borderWidth: 3, pointRadius: 5, tension: .2
  }));
  const gPob = new Chart(document.getElementById("graficaPoblacion"), {
    type: "line",
    data: { labels: DATOS.censos, datasets: datasetsPob("indice") },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom" },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } }
      },
      scales: {
        y: { title: { display: true, text: "Índice (primer censo = 100)" }, ticks: { callback: v => fmt(v) } },
        x: { grid: { display: false } }
      }
    },
    plugins: [franjaTraslado]
  });
  document.querySelectorAll("#controles-poblacion button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#controles-poblacion button").forEach(x => x.classList.remove("activo"));
    b.classList.add("activo");
    const modo = b.dataset.modo;
    gPob.data.datasets = datasetsPob(modo);
    gPob.options.scales.y.title.text = modo === "indice" ? "Índice (primer censo = 100)" : "Habitantes";
    gPob.update();
  }));

  // 2. Urbanización
  new Chart(document.getElementById("graficaUrbana"), {
    type: "bar",
    data: {
      labels: DATOS.censos,
      datasets: Object.entries(DATOS.porcentajeCabecera).map(([nom, serie]) => ({
        label: nom, data: serie, backgroundColor: COLORES[nom], borderRadius: 4
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom" },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y}%` } }
      },
      scales: {
        y: { min: 0, max: 100, title: { display: true, text: "% en cabecera" }, ticks: { callback: v => v + "%" } },
        x: { grid: { display: false } }
      }
    }
  });

  // 3. Educación por sexo
  const datasetsEdu = zona => [
    { label: "Hombres", data: DATOS.alfabetismo[zona].hombres, borderColor: "#33302d", backgroundColor: "#33302d", borderWidth: 3, pointRadius: 5, tension: .2 },
    { label: "Mujeres", data: DATOS.alfabetismo[zona].mujeres, borderColor: "#a4512b", backgroundColor: "#a4512b", borderWidth: 3, pointRadius: 5, tension: .2 }
  ];
  const gEdu = new Chart(document.getElementById("graficaEducacion"), {
    type: "line",
    data: { labels: DATOS.censos, datasets: datasetsEdu("total") },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom" },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y}%` } }
      },
      scales: {
        y: { min: 0, max: 100, title: { display: true, text: "% alfabeta" }, ticks: { callback: v => v + "%" } },
        x: { grid: { display: false } }
      }
    },
    plugins: [franjaTraslado]
  });
  document.querySelectorAll("#controles-educacion button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#controles-educacion button").forEach(x => x.classList.remove("activo"));
    b.classList.add("activo");
    gEdu.data.datasets = datasetsEdu(b.dataset.zona);
    gEdu.update();
  }));
}

// ---------- Barra de progreso y menú activo ----------
const barra = document.getElementById("progreso");
const enlaces = [...document.querySelectorAll("nav a")];
const secciones = enlaces.map(a => document.querySelector(a.getAttribute("href")));
window.addEventListener("scroll", () => {
  const h = document.documentElement;
  barra.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
  let actual = 0;
  secciones.forEach((s, i) => { if (s && s.getBoundingClientRect().top < 140) actual = i; });
  enlaces.forEach((a, i) => a.classList.toggle("activo", i === actual && h.scrollTop > 300));
}, { passive: true });

// ---------- Aparición suave al hacer scroll ----------
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); }
}), { threshold: .08 });
document.querySelectorAll(".aparecer").forEach(el => obs.observe(el));
</script>
</body>
</html>
